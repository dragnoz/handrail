name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:firefox
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm zip
      # The unpacked builds, not the release zips: GitHub wraps an artifact in its own zip,
      # so this way the downloaded handrail-firefox.zip has manifest.json at its top and loads as is.
      - uses: actions/upload-artifact@v4
        with:
          name: handrail-chrome
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: handrail-firefox
          path: dist-firefox/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
